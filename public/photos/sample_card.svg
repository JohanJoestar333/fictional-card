<svg xmlns="http://www.w3.org/2000/svg" width="856" height="540" viewBox="0 0 856 540">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="35%" stop-color="#14171d"/>
      <stop offset="70%" stop-color="#1a1e26"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#metalGrad)"/>
  <rect width="100%" height="100%" fill="url(#sheen)"/>
  
  <!-- Subtle Guilloche Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.2" fill="none">
    <circle cx="428" cy="270" r="120"/>
    <circle cx="428" cy="270" r="160"/>
    <circle cx="428" cy="270" r="200"/>
    <circle cx="428" cy="270" r="240"/>
    <circle cx="428" cy="270" r="280"/>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" fill="none"/>
  <path d="M 816 70 L 816 40 L 786 40" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" fill="none"/>
  <path d="M 40 470 L 40 500 L 70 500" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" fill="none"/>
  <path d="M 816 470 L 816 500 L 786 500" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" fill="none"/>

  <!-- Outer Border -->
  <rect x="24" y="24" width="808" height="492" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
</svg>
